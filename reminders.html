<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script>
  (function () {
    var hasSession = !!(localStorage.getItem("billtrack_session_v1") || sessionStorage.getItem("billtrack_session_v1"));
    if (!hasSession) { window.location.replace("login.html"); }
  })();
</script>
<script>
  (function () {
    try {
      if (localStorage.getItem("billtrack_sidebar_collapsed_v1") === "1" && window.innerWidth > 991) {
        document.documentElement.classList.add("sidebar-collapsed");
      }
    } catch (e) {}
  })();
</script>
<meta name="theme-color" content="#1f5a45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BillTrack">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/billtrack-logo.svg">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<title>Reminders — BillTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<header class="topbar">
  <button type="button" class="sidebar-toggle-btn" id="sidebarToggle" aria-label="Hide or show menu" aria-controls="sidebar" aria-expanded="true"><i class="ti ti-menu-2"></i></button>
  <a href="index.html" class="topbar-brand"><img src="assets/billtrack-logo.svg" class="brand-mark" alt="" aria-hidden="true"> <span>BillTrack</span></a>
  <div class="topbar-actions">
  </div>
</header>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app-shell">

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand"><img src="assets/billtrack-logo.svg" class="brand-mark" alt="" aria-hidden="true"> <span>BillTrack</span></div>
    <a href="index.html" class="nav-item-link"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
    <a href="bills.html" class="nav-item-link"><i class="ti ti-file-invoice"></i> Bills</a>
    <a href="payments.html" class="nav-item-link"><i class="ti ti-receipt-2"></i> Payment History</a>
    <a href="reminders.html" class="nav-item-link active"><i class="ti ti-bell"></i> Reminders</a>
    <a href="forecasting.html" class="nav-item-link"><i class="ti ti-chart-line"></i> Forecasting</a>
    <a href="budget.html" class="nav-item-link"><i class="ti ti-report-money"></i> Budget</a>
    <a href="profile.html" class="nav-item-link"><i class="ti ti-user-circle"></i> Profile</a>
    <button type="button" class="nav-item-link calc-trigger" data-calc-toggle><i class="ti ti-calculator"></i> Calculator</button>
    <div class="sidebar-footer">Personal Household Bills &amp; Subscription Manager</div>
    <div class="sidebar-user">
      <div class="sidebar-user-avatar" id="sidebarUserAvatar">?</div>
      <div class="sidebar-user-name" id="sidebarUserName">…</div>
      <button type="button" class="sidebar-logout-btn" id="sidebarLogoutBtn" title="Log out" aria-label="Log out"><i class="ti ti-logout"></i></button>
    </div>
  </nav>

  <main class="main-content">
    <div class="page-heading">Reminders</div>
    <div class="page-subtext">Bills grouped by how soon they're due.</div>

    <div class="row g-3">
      <div class="col-lg-4">
        <div class="card-surface h-100">
          <div class="d-flex align-items-center gap-2 mb-3">
            <span class="status-pill status-overdue"><i class="ti ti-alert-triangle"></i> Overdue (<span id="overdueCount">0</span>)</span>
          </div>
          <div id="overdueList"></div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card-surface h-100">
          <div class="d-flex align-items-center gap-2 mb-3">
            <span class="status-pill status-upcoming"><i class="ti ti-clock"></i> Due soon (<span id="dueSoonCount">0</span>)</span>
          </div>
          <div id="dueSoonList"></div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card-surface h-100">
          <div class="d-flex align-items-center gap-2 mb-3">
            <span class="status-pill" style="background:rgba(30,58,95,0.08);color:var(--navy);"><i class="ti ti-calendar"></i> Upcoming (<span id="upcomingCount">0</span>)</span>
          </div>
          <div id="upcomingList"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="utils.js"></script>
<script src="auth.js"></script>
<script src="script.js"></script>
<script src="pwa.js"></script>
</body>
</html>

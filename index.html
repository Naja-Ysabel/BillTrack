<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script>
  (function () {
    var hasSession = !!(localStorage.getItem("billtrack_session_v1") || sessionStorage.getItem("billtrack_session_v1"));
    if (!hasSession) { window.location.replace("login.html"); }
  })();
</script>
<script>
  (function () {
    try {
      if (localStorage.getItem("billtrack_sidebar_collapsed_v1") === "1" && window.innerWidth > 991) {
        document.documentElement.classList.add("sidebar-collapsed");
      }
    } catch (e) {}
  })();
</script>
<meta name="theme-color" content="#1f5a45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BillTrack">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/billtrack-logo.svg">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<title>Dashboard — BillTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<header class="topbar">
  <button type="button" class="sidebar-toggle-btn" id="sidebarToggle" aria-label="Hide or show menu" aria-controls="sidebar" aria-expanded="true"><i class="ti ti-menu-2"></i></button>
  <a href="index.html" class="topbar-brand"><img src="assets/billtrack-logo.svg" class="brand-mark" alt="" aria-hidden="true"> <span>BillTrack</span></a>
  <div class="topbar-actions">
  </div>
</header>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app-shell">

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand"><img src="assets/billtrack-logo.svg" class="brand-mark" alt="" aria-hidden="true"> <span>BillTrack</span></div>
    <a href="index.html" class="nav-item-link active"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
    <a href="bills.html" class="nav-item-link"><i class="ti ti-file-invoice"></i> Bills</a>
    <a href="payments.html" class="nav-item-link"><i class="ti ti-receipt-2"></i> Payment History</a>
    <a href="reminders.html" class="nav-item-link"><i class="ti ti-bell"></i> Reminders</a>
    <a href="forecasting.html" class="nav-item-link"><i class="ti ti-chart-line"></i> Forecasting</a>
    <a href="budget.html" class="nav-item-link"><i class="ti ti-report-money"></i> Budget</a>
    <a href="profile.html" class="nav-item-link"><i class="ti ti-user-circle"></i> Profile</a>
    <button type="button" class="nav-item-link calc-trigger" data-calc-toggle><i class="ti ti-calculator"></i> Calculator</button>
    <div class="sidebar-footer">Personal Household Bills &amp; Subscription Manager</div>
    <div class="sidebar-user">
      <div class="sidebar-user-avatar" id="sidebarUserAvatar">?</div>
      <div class="sidebar-user-name" id="sidebarUserName">…</div>
      <button type="button" class="sidebar-logout-btn" id="sidebarLogoutBtn" title="Log out" aria-label="Log out"><i class="ti ti-logout"></i></button>
    </div>
  </nav>

  <main class="main-content">
    <div class="page-heading" id="dashboardGreeting">Overview</div>
    <div class="page-subtext">Here's your household bill overview.</div>

    <div class="row row-cols-2 row-cols-md-3 row-cols-xl-5 g-3 mb-4">
      <div class="col">
        <div class="card-surface metric-card h-100">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="metric-label">Total expenses</div>
              <div class="metric-value" id="metricTotalExpenses">₱0.00</div>
            </div>
            <div class="metric-icon icon-bg-navy"><i class="ti ti-receipt"></i></div>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card-surface metric-card h-100">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="metric-label">Upcoming bills</div>
              <div class="metric-value" style="color:var(--warning);" id="metricUpcomingBills">0</div>
            </div>
            <div class="metric-icon icon-bg-amber"><i class="ti ti-clock"></i></div>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card-surface metric-card h-100">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="metric-label">Budget status</div>
              <div class="metric-value" style="color:var(--success);font-size:17px;" id="metricBudgetStatus">—</div>
            </div>
            <div class="metric-icon icon-bg-teal"><i class="ti ti-wallet"></i></div>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card-surface metric-card h-100">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="metric-label">Forecast</div>
              <div class="metric-value" style="color:var(--success);" id="metricForecast">—</div>
            </div>
            <div class="metric-icon icon-bg-teal"><i class="ti ti-trending-up"></i></div>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card-surface metric-card h-100">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="metric-label">Anomaly alerts</div>
              <div class="metric-value" style="color:var(--danger);" id="metricAnomalyAlerts">0</div>
            </div>
            <div class="metric-icon icon-bg-red"><i class="ti ti-alert-circle"></i></div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-7">
        <div class="card-surface h-100">
          <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <div style="font-weight:500;font-size:14px;">Monthly bills</div>
            <div class="range-toggle">
              <button data-range="3M">3M</button>
              <button data-range="6M" class="active">6M</button>
              <button data-range="1Y">1Y</button>
            </div>
          </div>
          <div style="position:relative;height:260px;">
            <canvas id="billsChart"></canvas>
          </div>
        </div>
      </div>

      <div class="col-lg-5 d-flex flex-column gap-3">

        <div class="card-surface flex-fill">
          <div style="font-weight:500;font-size:14px;" class="mb-2">Recent bills</div>
          <div id="recentBillsList"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="utils.js"></script>
<script src="auth.js"></script>
<script src="script.js"></script>
<script src="pwa.js"></script>
</body>
</html>
